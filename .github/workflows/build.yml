# Checks every pull request into develop and every change to develop (etalii.adp spec 001-ci-and-badges).
#
# The build job decides this workflow's result and badge: the plug-in builds, the headless tests pass, the plug-in
# verifies against the IDEs it declares, and every shipped library has an allowed licence. That is `./gradlew build`
# without integrationTest, which `check` otherwise depends on.
#
# Some headless tests draw on a Swing canvas, so this job also runs under xvfb-run.
#
# The real-IDE tests run in their own job. They are not yet stable on hosted runners (a different IntelliJ IDEA
# test fails from run to run), so that job reports its result but cannot fail the workflow (continue-on-error).
# Making them stable, and moving them back into the build job, is spec 005's work. Both jobs give xvfb-run a
# full-size screen: its default 640x480x8 screen leaves editor components "not showing".
#
# What else this repository's CI does (development builds, versioned releases) is spec 005's to decide.
name: Build

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # javaVersion in gradle.properties. Not Temurin: the jar manifest records the JDK's vendor, and Temurin's
      # vendor name contains the previous host's name, which NoPreviousHostIntegrationTest forbids.
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
      # Caches Gradle and the IntelliJ Platform downloads between runs.
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, test and verify the plug-in
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' ./gradlew build -x integrationTest
      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/'
      - name: Offer the plug-in for download
        uses: actions/upload-artifact@v7
        with:
          name: etalii.adp.ide.intellij-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

  real-ide-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    # TEMPORARY: repeats the job to reproduce the intermittent failures; removed before review.
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run the real-IDE tests
        # The IDEs the tests download and the folders they run in, where the IDE logs are kept from.
        env:
          ADP_IDE_TESTS_HOME: ${{ runner.temp }}/ide-tests-home
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' ./gradlew integrationTest
      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: real-ide-test-reports-${{ matrix.attempt }}
          path: '**/build/reports/'
      # Each IDE's own log, and the thread dumps the Starter framework takes before it kills a hung IDE.
      - name: Keep the IDE logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: real-ide-logs-${{ matrix.attempt }}
          path: ${{ runner.temp }}/ide-tests-home/out/ide-tests/tests/**/log/
          if-no-files-found: ignore
